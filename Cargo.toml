[package]
name = "bookmeta"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Book metadata by ISBN from several catalogues"
repository = "https://github.com/magnusmanske/bookmeta"

[dependencies]
futures = "0.3"
isbn = "0.8"
reqwest = { version = "0.13", features = ["json", "query"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
